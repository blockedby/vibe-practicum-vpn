services:
  vpnkit:
    build:
      context: .
      dockerfile: docker/vpnkit/Dockerfile
    restart: unless-stopped
    ports:
      - "${VPNKIT_OPENVPN_BIND_ADDRESS:-0.0.0.0}:${VPNKIT_OPENVPN_PORT:-1194}:1194/udp"
    environment:
      VPNKIT_ROUTING_MODE: "${VPNKIT_ROUTING_MODE:-redirect}"
      OVPN_CIDR: "${OVPN_CIDR:-10.89.0.0/24}"
      VPNKIT_IPV6_POLICY: "${VPNKIT_IPV6_POLICY:-block}"
      VPNKIT_COMPAT_BYPASS_ENABLED: "${VPNKIT_COMPAT_BYPASS_ENABLED:-false}"
      VPNKIT_COMPAT_BYPASS_ENDPOINTS: "${VPNKIT_COMPAT_BYPASS_ENDPOINTS:-}"
      VPNKIT_COMPAT_BYPASS_ALLOW_ICMP: "${VPNKIT_COMPAT_BYPASS_ALLOW_ICMP:-false}"
      VPNKIT_ENABLE_VIBE_VPN_DAEMON: "${VPNKIT_ENABLE_VIBE_VPN_DAEMON:-false}"
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ${VPNKIT_RENDERED_ROOT:-./secrets/vps/rendered}/openvpn:/etc/openvpn:ro
      - ${VPNKIT_RENDERED_ROOT:-./secrets/vps/rendered}/sing-box:/etc/sing-box:ro
      - ${VPNKIT_RENDERED_ROOT:-./secrets/vps/rendered}/vibe-vpn:/etc/vibe-vpn:ro
      - vpnkit-vibe-vpn-state:/var/lib/vibe-vpn
      - vpnkit-sing-box-state:/var/lib/vpnkit/sing-box
      - ${VPNKIT_LOG_ROOT:-./logs}:/var/log/vpnkit
      - ${VPNKIT_LOG_ROOT:-./logs}/vibe-vpn:/var/log/vibe-vpn
    healthcheck:
      test: ["CMD", "/usr/local/bin/vpnkit-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ovpn-client-test:
    build: ./docker/ovpn-client-test
    profiles: ["test"]
    depends_on:
      - vpnkit
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${VPNKIT_CLIENT_PROFILE_ROOT:-./secrets/vps/openvpn/client}:/etc/openvpn/client:ro
      - ${VPNKIT_LOG_ROOT:-./logs}:/var/log/vpnkit
    command: ["/etc/openvpn/client/test-client.ovpn"]

volumes:
  vpnkit-vibe-vpn-state:
  vpnkit-sing-box-state:
