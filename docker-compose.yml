services:
  vpnkit:
    build: ./docker/vpnkit
    container_name: vpnkit
    restart: unless-stopped
    ports:
      - "1194:1194/udp"
    environment:
      ENABLE_DEPRECATED_LEGACY_DNS_SERVERS: "true"
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ./secrets/vps/rendered/openvpn:/etc/openvpn:ro
      - ./secrets/vps/rendered/sing-box:/etc/sing-box:ro
      - ./logs:/var/log/vpnkit

  ovpn-client-test:
    build: ./docker/ovpn-client-test
    container_name: ovpn-client-test
    profiles: ["test"]
    depends_on:
      - vpnkit
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./secrets/vps/openvpn/client:/etc/openvpn/client:ro
      - ./logs:/var/log/vpnkit
    command: ["/etc/openvpn/client/test-client.ovpn"]
