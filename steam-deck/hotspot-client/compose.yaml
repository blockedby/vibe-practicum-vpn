services:
  host-ovpn-client:
    build:
      context: .
      dockerfile: Containerfile
    image: ${VPNKIT_DECK_CLIENT_IMAGE:-localhost/vpnkit-host-ovpn-client:latest}
    container_name: ${VPNKIT_DECK_CLIENT_CONTAINER:-vpnkit-host-ovpn-client}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${VPNKIT_DECK_CLIENT_PROFILE:-./local/client.ovpn}:/etc/openvpn/client.ovpn:ro
      - ${VPNKIT_DECK_LOG_DIR:-./logs}:/var/log/vpnkit-host-client
    environment:
      OPENVPN_PROFILE: /etc/openvpn/client.ovpn
      OPENVPN_LOG: /var/log/vpnkit-host-client/openvpn.log
    restart: unless-stopped
