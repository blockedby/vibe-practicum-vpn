# Example failover daemon config. Copy to /etc/vibe-vpn/config.yaml and keep mode 0600.
# Do not put subscription URLs, VLESS links, tokens, or auth secrets in git.
subscription_file: /etc/vibe-vpn/sub_url
extra_nodes_file: /etc/vibe-vpn/extra-nodes.json
# Production runtime is sing-box. Temporary node benchmarks may still use isolated xray
# processes on test_socks only; they do not change the production sing-box service.
runtime: singbox
sing_box_bin: /usr/bin/sing-box
sing_box_config: /etc/sing-box-vibe/tproxy-canary.json
sing_box_service: sing-box-vibe-router
# xray_bin is used only for isolated temporary benchmarks.
xray_bin: /usr/local/bin/xray
# Legacy production xray config is used only when runtime: xray is explicitly set.
xray_config: /usr/local/etc/xray/config.json
state_dir: /var/lib/vibe-vpn
production_socks: 127.0.0.1:2080
test_socks: 127.0.0.1:18080
test_url: https://proof.ovh.net/files/10Mb.dat
test_limit_kib: 512
timeout_seconds: 12

service:
  enabled: true
  startup_test: true
  # Default: fastest-rotation applies the fastest OK non-excluded node after a successful scheduled/startup test.
  # Opt out with failover-only to apply production changes only after confirmed health failure.
  mode: fastest-rotation

test:
  interval: 30m

health:
  normal_interval: 5s
  failure_retry_delays: [1s, 2s, 3s]
  probe_timeout: 5s
  required_urls:
    - https://x.com/
    - https://www.linkedin.com/
  diagnostic_urls:
    - https://ya.ru/

logging:
  path: /var/log/vibe-vpn/
  retention: 12h
  also_journal: true
