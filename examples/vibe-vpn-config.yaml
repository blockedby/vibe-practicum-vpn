# Example failover daemon config. Copy to /etc/vibe-vpn/config.yaml and keep mode 0600.
# Do not put subscription URLs, VLESS links, tokens, or auth secrets in git.
subscription_file: /etc/vibe-vpn/sub_url
extra_nodes_file: /etc/vibe-vpn/extra-nodes.json
xray_bin: /usr/local/bin/xray
xray_config: /usr/local/etc/xray/config.json
state_dir: /var/lib/vibe-vpn
production_socks: 127.0.0.1:10808
test_socks: 127.0.0.1:18080
test_url: https://proof.ovh.net/files/10Mb.dat
test_limit_kib: 512
timeout_seconds: 12

service:
  enabled: true
  startup_test: true

test:
  interval: 30m

health:
  normal_interval: 5s
  failure_retry_delays: [1s, 2s, 3s]
  probe_timeout: 5s
  required_urls:
    - https://x.com/
    - https://rutracker.org/
  diagnostic_urls:
    - https://ya.ru/

logging:
  path: /var/log/vibe-vpn/
  retention: 12h
  also_journal: true
